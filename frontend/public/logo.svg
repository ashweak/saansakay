<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SaanSakay logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="clip"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
  <!-- overhead rail + vertical stanchion -->
  <rect x="7" y="9" width="50" height="5" rx="2.5" fill="#ffffff" opacity=".9"/>
  <rect x="27" y="11" width="7" height="53" fill="url(#pole)"/>
  <!-- forearm coming from lower right -->
  <path d="M60 64 L60 52 Q50 44 41 41 L36 50 Q46 55 50 64 Z" fill="#f2b98a" stroke="#7a3e1d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- shirt sleeve -->
  <path d="M64 54 L54 64 L66 66 Z M52 49 L64 41 L66 66 L58 66 Q57 57 52 49 Z" fill="#fbbf24" stroke="#7a3e1d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- palm behind the pole -->
  <path d="M34 24 Q44 24 45 33 Q45 43 37 46 L34 46 Z" fill="#f2b98a" stroke="#7a3e1d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- four fingers wrapped around the front of the pole -->
  <g fill="#f8c9a0" stroke="#7a3e1d" stroke-width="1.6">
    <rect x="22" y="24.5" width="16" height="5.6" rx="2.8"/>
    <rect x="21" y="30.1" width="17" height="5.6" rx="2.8"/>
    <rect x="21.5" y="35.7" width="16.5" height="5.6" rx="2.8"/>
    <rect x="23" y="41.3" width="14.5" height="5.2" rx="2.6"/>
  </g>
  <!-- thumb over the index finger -->
  <path d="M37 25 Q32 20.5 26.5 22.5 Q24 23.6 25.5 25.4 Q29 24.6 34 27.5 Z" fill="#f8c9a0" stroke="#7a3e1d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- knuckle shine -->
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round">
    <path d="M24.5 26.6 h4"/><path d="M23.5 32.2 h4"/><path d="M24 37.8 h4"/>
  </g>
  </g>
</svg>
